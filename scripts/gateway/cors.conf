# Shared CORS handling, included into every gateway location. Reflects the
# request's Origin and requested headers (local dev only — every origin/header
# is trusted) and short-circuits the browser's preflight OPTIONS request before
# it reaches upstream.
proxy_hide_header Access-Control-Allow-Origin;
proxy_hide_header Access-Control-Allow-Credentials;
proxy_hide_header Access-Control-Allow-Methods;
proxy_hide_header Access-Control-Allow-Headers;

add_header Access-Control-Allow-Origin $http_origin always;
add_header Access-Control-Allow-Credentials true always;
add_header Access-Control-Allow-Methods 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
# Reflect whatever headers the client asked for, rather than a hard-coded list
# that silently falls behind whatever headers the supabase-js version sends.
add_header Access-Control-Allow-Headers $http_access_control_request_headers always;

# nginx quirk: an `if` block that calls add_header does NOT inherit the
# add_header calls above it in the same location — it needs its own complete
# set, or the preflight response goes out missing the CORS headers entirely
# (which is what silently broke browser auth here).
if ($request_method = OPTIONS) {
  add_header Access-Control-Allow-Origin $http_origin always;
  add_header Access-Control-Allow-Credentials true always;
  add_header Access-Control-Allow-Methods 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
  add_header Access-Control-Allow-Headers $http_access_control_request_headers always;
  add_header Access-Control-Max-Age 86400 always;
  add_header Content-Length 0;
  add_header Content-Type text/plain;
  return 204;
}
