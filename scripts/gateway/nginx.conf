# Local-only API gateway for the compose stack. Hosted Supabase fronts its
# services with Kong; for local dev this nginx shim is enough:
#
#   /auth/v1/*  -> GoTrue      (supabase-js auth calls)
#   everything  -> PostgREST   (serves tables at the path root, e.g. /profiles;
#                               supabase-js also prefixes /rest/v1/)
#
# The browser (localhost:8081) and the gateway (localhost:54321) are different
# origins, so supabase-js's POST/PATCH/DELETE calls trigger a CORS preflight.
# GoTrue/PostgREST answer CORS themselves, but only for direct requests; sitting
# behind this proxy we terminate the OPTIONS preflight here and normalize the
# response headers (proxy_hide_header + add_header, so upstream and gateway
# headers never both land on the same response and get rejected as duplicates).
worker_processes 1;
events { worker_connections 256; }

http {
  access_log /dev/stdout;
  error_log  /dev/stderr;

  proxy_http_version 1.1;
  proxy_set_header Host              $host;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  server {
    listen 80;

    location = /healthz {
      add_header Content-Type text/plain;
      return 200 'ok';
    }

    location /auth/v1/ {
      include /etc/nginx/cors.conf;
      proxy_pass http://auth:9999/;
    }

    location /rest/v1/ {
      include /etc/nginx/cors.conf;
      proxy_pass http://rest:3000/;
    }

    location / {
      include /etc/nginx/cors.conf;
      proxy_pass http://rest:3000/;
    }
  }
}
